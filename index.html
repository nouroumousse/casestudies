<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f3ef" />
  <meta name="description" content="An art-directed brand case study studio. Turn your identity assets into thoughtful, editable portfolio pages." />
  <title>Case Study Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;450;500;550;600;650;700;750;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand-lockup" href="#home" aria-label="Case Study Studio home">
        <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">case study<span>studio</span></span>
      </a>
      <div class="sidebar-rule"></div>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-nav="projects"><span class="nav-icon">▦</span> Projects <span class="nav-count" id="project-count">0</span></button>
        <button class="nav-item" data-action="new-project"><span class="nav-icon">＋</span> New case study</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span class="note-mark">✳</span><div><strong>Your work stays yours.</strong><p>Projects and uploaded assets are stored locally in this browser.</p></div></div>
        <button class="nav-item subtle" data-action="settings"><span class="nav-icon">⚙</span> Settings & data</button>
        <div class="sidebar-footer"><span class="status-dot"></span> LOCAL WORKSPACE <span class="version">v1.0</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb"><span>Workspace</span><b>/</b><strong>Projects</strong></div>
        <div class="topbar-actions">
          <span class="save-state" id="save-state"><span class="save-dot"></span> All changes saved</span>
          <button class="avatar-button" title="Local workspace" aria-label="Local workspace">N</button>
        </div>
      </header>
      <section id="view" class="view-area" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script src="app.js" defer></script>
</body>
</html>
